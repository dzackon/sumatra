name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build Sumatra
        uses: rocq-prover/docker-opam-action@v1
        with:
          coq_version: "9.2"
          opam_file: "rocq-sumatra.opam"
